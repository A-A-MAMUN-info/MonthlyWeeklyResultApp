name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project
        run: |
          echo "Searching for Android project..."
          find . -name "build.gradle" -o -name "build.gradle.kts"

      - name: Build Debug APK
        run: |
          cd android-project
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find android-project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MonthlyWeeklyResultApp-debug
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
